# Day-0 nudge + survey, sent on WhatsApp the day the scheme goes live.
# One message per cohort (the LLM writes the wording from `nudge_brief`, in the distributor's language).
# Q1 is the quick-reply "intent" that drives the CTA plan; Q2–Q5 are the experience ratings; Q6 differs by cohort.
scheme_id: SCH-2627-FES
send_day: 0
close_day: 7

nudge_brief:                     # tone + angle per cohort; the Message agent turns this into EN/BN/HI text
  Invest / Expand: Thank them as a partner. Show their target, slab 1 and the stretch slab with the credit note. Short.
  Replace / Reassess: Explain the scheme in 3 lines with their own target. No PDF. Offer Bengali and ASM.
  Protect: Appreciate their consistency. Their target and slab 1 in one line; keep it light.
  Exit / Watchlist: Short check-in. One line on the scheme, one tap to talk to the ASM.

questions:
  - id: Q1
    type: quick_reply
    text: Have you seen the Festive Scheme? What would you like to do?
    options:                     # these five labels are the INTENTS used everywhere (CTA rules, dashboards, persona)
      - I've enrolled
      - I'll enrol
      - Explain again
      - Explain in Bengali
      - Talk to my ASM
  - id: Q2
    type: rating_1_5
    text: How clear is the scheme to you?
  - id: Q3
    type: rating_1_5
    text: How much will this scheme help your business?
  - id: Q4
    type: rating_1_5
    text: How confident are you of reaching your target?
  - id: Q5
    type: rating_1_5
    text: How happy are you with how incentives are paid?
  - id: Q6
    type: single_choice
    text: What would help you most right now?
    options_by_cohort:
      Invest / Expand: [Faster payouts, Clear slab examples, Higher slab bonus, ASM visit]
      Replace / Reassess: [Simpler explanation, Explanation in Bengali, ASM visit, Credit support]
      Protect: [Faster payouts, Stock on time, Clear slab examples, Better margin]
      Exit / Watchlist: [Better margin, Credit terms, Stock availability, Call me]
  - id: Q7
    type: open_text
    optional: true
    text: Anything else you'd like to tell us?

response_window_days: 7
reminder:                        # one automatic reminder to non-responders
  day: 3
  at: distributor's active window from the persona (default 10:00)
